<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar contraseña · El Alto Limpio</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/acceso.css">
</head>
<body class="acceso">
<section class="foto oscura">
  <div class="logo-f">
    <svg viewBox="0 0 40 40" width="46" height="46"><path d="M33 5C17 4 7 13 7 25c0 3 .8 5.5 2 7.5C11 27 16 21 24 17c-6 5-10 11-12 18 3.5 2 7 1 10-1 9-6 12-17 11-29z" fill="#fff"/></svg>
    <span><b>El Alto Limpio</b><small>Monitoreo Ambiental</small></span>
  </div>
  <p>Recupera el acceso a tu cuenta</p>
</section>

<section class="lado">
  <div class="tarjeta">
    <a class="volver" href="/"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al mapa</a>
    <h1 id="titulo">Recuperar contraseña</h1>
    <p class="sub" id="sub">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>
    <div id="msg" hidden></div>

    <form id="f-correo">
      <label for="email">Correo electrónico</label>
      <div class="campo"><input id="email" type="email" placeholder="ejemplo@correo.com" required></div>
      <button class="btn-reg oscuro" type="submit">Enviar enlace</button>
    </form>

    <form id="f-clave" hidden>
      <label for="p1">Nueva contraseña</label>
      <div class="campo"><input id="p1" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required></div>
      <label for="p2">Confirmar contraseña</label>
      <div class="campo"><input id="p2" type="password" placeholder="Repite tu contraseña" minlength="8" required></div>
      <button class="btn-reg oscuro" type="submit">Guardar contraseña</button>
    </form>

    <p class="alt"><a href="/acceso">Volver a iniciar sesión</a></p>
  </div>
</section>

<script>const CFG = {{ cfg|tojson }};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const cliente = supabase.createClient(CFG.url, CFG.key);
const $ = id => document.getElementById(id);
function aviso(t, bueno) { const e = $('msg'); e.textContent = t; e.className = bueno ? 'ok' : 'error'; e.hidden = false; }

// 1) Pedir el enlace por correo
$('f-correo').onsubmit = async e => {
  e.preventDefault();
  const {error} = await cliente.auth.resetPasswordForEmail($('email').value, {redirectTo: location.origin + '/recuperar'});
  error ? aviso('No se pudo enviar: ' + error.message) : aviso('Listo. Revisa tu correo y abre el enlace en este mismo navegador.', true);
};

// 2) Al volver desde el correo, Supabase avisa y mostramos el formulario de nueva contraseña
cliente.auth.onAuthStateChange(evento => {
  if (evento === 'PASSWORD_RECOVERY') {
    $('f-correo').hidden = true; $('f-clave').hidden = false; $('msg').hidden = true;
    $('titulo').textContent = 'Nueva contraseña'; $('sub').textContent = 'Elige una contraseña nueva para tu cuenta.';
  }
});
$('f-clave').onsubmit = async e => {
  e.preventDefault();
  if ($('p1').value !== $('p2').value) return aviso('Las contraseñas no coinciden');
  const {error} = await cliente.auth.updateUser({password: $('p1').value});
  if (error) return aviso('No se pudo guardar: ' + error.message);
  aviso('Contraseña actualizada. Te llevamos al inicio de sesión...', true);
  setTimeout(() => location.href = '/acceso', 1800);
};
</script>
</body></html>
