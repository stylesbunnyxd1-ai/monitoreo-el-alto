<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · El Alto Limpio</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/acceso.css">
</head>
<body class="acceso">
<section class="foto oscura">
  <div class="logo-f">
    <svg viewBox="0 0 40 40" width="46" height="46"><path d="M33 5C17 4 7 13 7 25c0 3 .8 5.5 2 7.5C11 27 16 21 24 17c-6 5-10 11-12 18 3.5 2 7 1 10-1 9-6 12-17 11-29z" fill="#fff"/></svg>
    <span><b>El Alto Limpio</b><small>Monitoreo Ambiental</small></span>
  </div>
  <p>Inicia sesión para continuar</p>
</section>

<section class="lado">
  <div class="tarjeta">
    <a class="volver" href="/"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al mapa</a>
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa a tu cuenta para acceder al sistema.</p>

    {% if msg %}<div class="error">{{ msg }}</div>{% endif %}
    {% if ok %}<div class="ok">{{ ok }}</div>{% endif %}

    <form method="post">
      <input type="hidden" name="modo" value="login">

      <label for="email">Correo electrónico</label>
      <div class="campo"><input id="email" name="email" type="email" placeholder="ejemplo@correo.com" required></div>

      <label for="password">Contraseña</label>
      <div class="campo">
        <input id="password" name="password" type="password" placeholder="Tu contraseña" required>
        <button type="button" class="ojo" aria-label="Mostrar u ocultar contraseña">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="fila">
        <label><input type="checkbox" name="recordar" checked> Recordarme</label>
        <a href="/recuperar">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-reg oscuro" type="submit">Iniciar sesión</button>
    </form>

    <p class="alt">¿No tienes cuenta? <a href="/acceso?modo=registro">Regístrate</a></p>
  </div>
</section>

<script>
document.querySelector('.ojo').onclick = () => {
  const i = document.getElementById('password');
  i.type = i.type === 'password' ? 'text' : 'password';
};
</script>
</body></html>
