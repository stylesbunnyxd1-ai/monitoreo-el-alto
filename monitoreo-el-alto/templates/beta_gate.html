<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acceso privado · Monitoreo El Alto</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f8;font-family:Arial,sans-serif;color:#17212b;padding:20px}main{width:min(100%,420px);background:white;padding:32px;border-radius:18px;box-shadow:0 12px 40px #10203018}h1{font-size:24px;margin:0 0 10px}p{color:#586574;line-height:1.5}label{display:block;font-weight:600;margin:20px 0 8px}input{width:100%;padding:13px;border:1px solid #ccd5dd;border-radius:9px;font-size:16px}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#146c94;color:white;font-size:16px;font-weight:700;cursor:pointer}.error{color:#b42318;background:#fff0ee;padding:10px;border-radius:8px}</style></head>
<body><main><h1>Acceso privado</h1><p>Esta es una versión beta de Monitoreo de la Contaminación Ambiental de El Alto. Ingresa la contraseña que te compartió el responsable para continuar.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/prueba-privada"><label for="password">Contraseña de prueba</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">Entrar a la beta</button></form></main></body></html>
