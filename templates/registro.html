<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro · El Alto Limpio</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/acceso.css">
</head>
<body class="acceso">
<section class="foto">
  <h2>Juntos por un<br>El Alto más limpio</h2>
  <p>Tu aporte hace la diferencia</p>
</section>

<section class="lado">
  <div class="tarjeta">
    <a class="volver" href="/"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al mapa</a>
    <h1>Crear una cuenta</h1>
    <p class="sub">Regístrate para poder reportar y participar en el cuidado de nuestra ciudad.</p>

    <div class="error" id="error" {% if not msg %}hidden{% endif %}>{{ msg or '' }}</div>

    <form method="post" id="form">
      <input type="hidden" name="modo" value="registro">

      <label for="nombre">Nombre completo</label>
      <div class="campo"><input id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required maxlength="60"></div>

      <label for="email">Correo electrónico</label>
      <div class="campo"><input id="email" name="email" type="email" placeholder="ejemplo@correo.com" required></div>

      <label for="password">Contraseña</label>
      <div class="campo">
        <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
        <button type="button" class="ojo" data-para="password" aria-label="Mostrar u ocultar contraseña">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="confirmar">Confirmar contraseña</label>
      <div class="campo">
        <input id="confirmar" name="confirmar" type="password" placeholder="Repite tu contraseña" minlength="8" required>
        <button type="button" class="ojo" data-para="confirmar" aria-label="Mostrar u ocultar contraseña">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button class="btn-reg" type="submit">Registrarse</button>
    </form>

    <p class="alt">¿Ya tienes cuenta? <a href="/acceso">Inicia sesión</a></p>
  </div>
</section>

<script>
// Mostrar u ocultar la contraseña con el ojito
document.querySelectorAll('.ojo').forEach(b => b.onclick = () => {
  const i = document.getElementById(b.dataset.para);
  i.type = i.type === 'password' ? 'text' : 'password';
});
// Avisar antes de enviar si las contraseñas no coinciden
document.getElementById('form').onsubmit = e => {
  const er = document.getElementById('error');
  if (document.getElementById('password').value !== document.getElementById('confirmar').value) {
    e.preventDefault(); er.textContent = 'Las contraseñas no coinciden'; er.hidden = false;
  }
};
</script>
</body></html>
